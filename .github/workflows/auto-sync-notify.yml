name: Auto-sync WeCom Notify to All Repos

on:
  schedule:
    - cron: '0 */6 * * *' # 每 6 小时同步一次
  workflow_dispatch:       # 也可手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure all org repos have WeCom notify workflow
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.ORG_ADMIN_TOKEN }}
          script: |
            const owner = 'Einfo-Tech';
            const filePath = '.github/workflows/wecom-notify.yml';
            const workflowText = [
              'name: Notify WeCom',
              '',
              'on:',
              '  push:',
              "    branches: ['**']",
              '  delete:',
              '  pull_request:',
              '    types: [opened, closed]',
              '',
              'jobs:',
              '  notify:',
              '    uses: Einfo-Tech/.github/.github/workflows/wecom-notify.yml@main',
              '    secrets: inherit',
              '',
            ].join('\n');
            const notifyContent = Buffer.from(workflowText, 'utf8').toString('base64');

            const repos = await github.paginate(github.rest.repos.listForOrg, {
              org: owner, per_page: 100
            });

            let added = [], updated = [], skipped = [], failed = [];

            for (const r of repos) {
              if (r.name === '.github' || r.archived) {
                skipped.push(r.name);
                continue;
              }
              try {
                let sha, currentContent;
                try {
                  const existing = await github.rest.repos.getContent({
                    owner, repo: r.name, path: filePath
                  });
                  sha = existing.data.sha;
                  currentContent = Buffer.from(existing.data.content, 'base64').toString('utf8');
                } catch (e) {
                  // File doesn't exist, will create
                }

                if (currentContent === workflowText) {
                  skipped.push(r.name);
                  continue;
                }

                await github.rest.repos.createOrUpdateFileContents({
                  owner, repo: r.name,
                  path: filePath,
                  message: sha
                    ? 'ci: auto-sync WeCom notification workflow'
                    : 'ci: auto-add WeCom notification workflow',
                  content: notifyContent,
                  ...(sha ? { sha } : {})
                });
                if (sha) {
                  updated.push(r.name);
                  console.log(`🔄 Updated: ${r.name}`);
                } else {
                  added.push(r.name);
                  console.log(`✅ Injected: ${r.name}`);
                }
              } catch (err) {
                failed.push(`${r.name} (${err.message})`);
                console.log(`❌ Failed: ${r.name} — ${err.message}`);
              }
            }

            console.log(`\n📊 Summary:`);
            console.log(`  ✅ Added: ${added.join(', ') || 'none'}`);
            console.log(`  🔄 Updated: ${updated.join(', ') || 'none'}`);
            console.log(`  ⏭️ Skipped: ${skipped.join(', ') || 'none'}`);
            console.log(`  ❌ Failed: ${failed.join(', ') || 'none'}`);

            if (failed.length) {
              core.setFailed(`Failed to sync ${failed.length} repos`);
            }
